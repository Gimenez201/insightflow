<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InsightFlow Pro</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Poppins;
      background: radial-gradient(circle at top, #1a1a2e, #0b0b10);
      color: white;
      padding: 40px;
    }

    .title {
      font-size: 52px;
      font-weight: 800;
      background: linear-gradient(90deg,#ff00cc,#00d9ff,#7a00ff,#ffcc00,#ff00cc);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      color: transparent;
      animation: rainbow 6s linear infinite;
    }

    @keyframes rainbow {
      0% { background-position: 0% }
      100% { background-position: 400% }
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 20px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 15px;
      border: none;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    button {
      margin-top: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      background: linear-gradient(90deg,#ff00cc,#00d9ff);
      color: white;
      margin-right: 8px;
    }

    .item {
      margin-top: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="title">InsightFlow Pro</div>

  <div class="container">

    <div class="card">
      <h3>Nova Análise</h3>

      <textarea id="input" placeholder="Digite sua análise..."></textarea>

      <div>
        <button id="save">Salvar</button>
        <button id="pdf">Exportar PDF</button>
      </div>
    </div>

    <div class="card">
      <h3>Histórico</h3>
      <div id="list"></div>
    </div>

  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    // 🔥 SUA CONFIG JÁ INSERIDA
    const firebaseConfig = {
      apiKey: "AIzaSyDJnEG0ocRf3qHXzMiwG-tcS7EK36onNNA",
      authDomain: "insightflow-5dee2.firebaseapp.com",
      projectId: "insightflow-5dee2",
      storageBucket: "insightflow-5dee2.firebasestorage.app",
      messagingSenderId: "370666999977",
      appId: "1:370666999977:web:3b5a8d50a31898bd8fd9b8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const input = document.getElementById("input");
    const saveBtn = document.getElementById("save");
    const pdfBtn = document.getElementById("pdf");
    const list = document.getElementById("list");

    let cache = [];

    async function load() {
      list.innerHTML = "";
      cache = [];

      const snap = await getDocs(collection(db, "analises"));

      snap.forEach(doc => {
        const data = doc.data();
        cache.push(data.texto);

        const div = document.createElement("div");
        div.className = "item";
        div.innerText = data.texto;
        list.appendChild(div);
      });
    }

    saveBtn.addEventListener("click", async () => {

      if (!input.value.trim()) {
        alert("Digite algo");
        return;
      }

      await addDoc(collection(db, "analises"), {
        texto: input.value,
        data: new Date()
      });

      input.value = "";
      load();
    });

    pdfBtn.addEventListener("click", () => {

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.text("InsightFlow - Relatório", 10, 10);

      let y = 20;

      cache.forEach((item, i) => {
        doc.text(`${i + 1}. ${item}`, 10, y);
        y += 10;
      });

      doc.save("insightflow.pdf");

    });

    load();

  </script>

</body>
</html>
