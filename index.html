<!-- FIREBASE + FUNCIONALIDADE -->
<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  // 🔥 SUA CONFIG (JÁ INSERIDA)
  const firebaseConfig = {
    apiKey: "AIzaSyDJnEG0ocRf3qHXzMiwG-tcS7EK36onNnA",
    authDomain: "insightflow-5dee2.firebaseapp.com",
    projectId: "insightflow-5dee2",
    storageBucket: "insightflow-5dee2.firebasestorage.app",
    messagingSenderId: "370666999977",
    appId: "1:370666999977:web:3b5a8d50a31898bd8fd9b8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let cache = [];

  // 🔹 cria painel invisível de input (não altera seu design)
  const hiddenInput = document.createElement("textarea");
  hiddenInput.style.display = "none";
  document.body.appendChild(hiddenInput);

  async function carregarHistorico() {
    cache = [];

    const snap = await getDocs(collection(db, "analises"));

    snap.forEach(doc => {
      cache.push(doc.data().texto);
    });

    console.log("Histórico carregado:", cache);
  }

  async function salvar(texto) {
    await addDoc(collection(db, "analises"), {
      texto,
      data: new Date()
    });

    carregarHistorico();
  }

  // 🔹 botão "Iniciar Análise"
  document.querySelector(".primary").addEventListener("click", () => {

    const texto = prompt("Digite sua análise:");

    if (!texto) return;

    salvar(texto);

  });

  // 🔹 exportação PDF
  document.querySelector(".secondary").addEventListener("click", () => {

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.text("InsightFlow - Relatório", 10, 10);

    let y = 20;

    cache.forEach((item, i) => {
      doc.text(`${i + 1}. ${item}`, 10, y);
      y += 10;
    });

    doc.save("insightflow.pdf");

  });

  carregarHistorico();

</script>

</body>
</html>
